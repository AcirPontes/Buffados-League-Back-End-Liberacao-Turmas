spring.application.name=liberacampus-ifmt
server.port=${PORT:8080}

# H2 persistente para facilitar a execucao local e a demonstracao em sala.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/liberacampus;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Cuiaba

spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Contas ficticias apenas para demonstracao academica local.
app.demo.enabled=${APP_DEMO_ENABLED:true}
app.bootstrap.admin.matricula=${APP_ADMIN_MATRICULA:}
app.bootstrap.admin.nome=${APP_ADMIN_NOME:Administrador institucional}
app.bootstrap.admin.senha=${APP_ADMIN_SENHA:}
app.bootstrap.admin.departamentos=${APP_ADMIN_DEPARTAMENTOS:DCOM,DABC,DINFRA,DGH,DEEA}

server.error.include-message=never
server.error.include-binding-errors=never
